[package]
name = "cosmonaut"
version = "0.0.1"
authors = ["nexos"]
edition = "2024"
license = "MPL-2.0"
publish = false
readme = "README.md"
description = "Servo browser engine with libcosmic shell"
repository = "https://github.com/nexoscp/cosmonaut"
keywords=["servo", "libcosmic"]

[dependencies]
dpi = "0.1.2"
url = "2.5.8"

[dependencies.servo]
git = "https://github.com/servo/servo.git"
rev = "c89caea7ef5e2d28e45ac1784c77a44e75ce58d4"
default-features = false
features = ["baked-in-resources", "bundled_freetype", "clipboard", "js_jit"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "dd108aa99d7306110eef06da43eafc109e1ab151"
default-features = false
features = ["about", "multi-window", "tokio", "wayland", "surface-message", "wgpu", "xdg-portal"]

[build-dependencies]
cargo_toml = "1.0.1"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
debug = false

[package.metadata.deb]
extended-description = """\

"""

assets = [
    ["target/release/cosmonaut", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/cosmonaut/README.md", "755"],
    ["cosmonaut.desktop", "usr/share/applications/", "644"]
]
